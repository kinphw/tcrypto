<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청라더헤븐이 이사했어요</title>
  <meta http-equiv="refresh" content="3; url=https://tcrypto.kro.kr/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f8; color: #14171f; font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; text-align: center; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #0e1015; color: #eceef2; } }
    .logo { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 18px; background: #2453d4; color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 700; }
    a { color: #2453d4; font-weight: 700; }
  </style>
</head>
<body>
  <div>
    <div class="logo">원</div>
    <h1>청라더헤븐이 이사했어요</h1>
    <p>새 주소: <a id="go" href="https://tcrypto.kro.kr/">tcrypto.kro.kr</a><br>잠시 뒤 자동으로 넘어갑니다.</p>
    <p style="opacity:.7;font-size:14px">예전 화면(블록체인 들여다보기)은 <a href="https://tcrypto.kro.kr/lab/">tcrypto.kro.kr/lab</a> 에 있어요.</p>
  </div>
  <script>
    // 예전 주소의 #/... 와 ?i= 초대 링크를 그대로 새 주소로 넘긴다 (#/relay/... 같은 예전 화면 주소는 실험실로)
    var h = location.hash || '', q = location.search || '';
    var base = /^#\/(relay|tx|blocks|address|explore|issuer|inbox|coins|send)/.test(h) ? 'https://tcrypto.kro.kr/lab/' : 'https://tcrypto.kro.kr/';
    var url = base + q + h;
    document.getElementById('go').href = url;
    setTimeout(function () { location.replace(url); }, 1500);
  </script>
</body>
</html>
