<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리 · 청라더헤븐</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#6b7280; --line:#e5e7eb; --brand:#2f6df6; --ok:#0f9d58; --bad:#d93025; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#e8eaed; --muted:#9aa0a6; --line:#2a2f37; --brand:#7aa2ff; --ok:#46c17b; --bad:#ff7066; --warn:#f0b35a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header b { font-size:16px; } header .sp { flex:1; }
  nav { display:flex; gap:4px; overflow-x:auto; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  nav button { white-space:nowrap; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .stat .k { color:var(--muted); font-size:13px; } .stat .v { font-size:22px; font-weight:700; margin-top:2px; } .stat .s { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .wrap { overflow-x:auto; }
  button, input, select { font:inherit; color:inherit; }
  button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.danger { color:var(--bad); }
  button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  input, select { border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:7px 10px; min-width:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .muted { color:var(--muted); }
  .mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; }
  #login { max-width:360px; margin:15vh auto; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; display:none; max-width:90vw; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div id="login" class="card hide">
  <h2>청라더헤븐 관리</h2>
  <form id="loginForm" class="row"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" style="flex:1"><button class="primary">들어가기</button></form>
  <p class="muted" id="loginMsg"></p>
</div>

<div id="app" class="hide">
  <header><b>청라더헤븐 관리</b><span class="muted" id="netName"></span><span class="sp"></span><a href="/" target="_blank">사이트</a><button id="logout">나가기</button></header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
